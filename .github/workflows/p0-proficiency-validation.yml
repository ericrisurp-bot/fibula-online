name: P0 - validar proficiências

on:
  push:
    branches:
      - fix/p0-proficiency-test-window
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    name: Testes, TypeScript e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install

      - name: Testes de proficiências
        run: npm run test:proficiency

      - name: Testes do motor
        run: npm run test:engine

      - name: Verificação TypeScript
        run: npx tsc -b

      - name: Build
        run: npm run build
