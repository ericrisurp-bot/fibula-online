name: Audio - validar efeitos e ambiência

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audio:
    name: Smoke test de áudio e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install

      - name: Testes de áudio
        run: npm run test:audio

      - name: Build
        run: npm run build
